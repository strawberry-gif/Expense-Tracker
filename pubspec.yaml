name: expense_tracker
description: A personal finance tracker with offline-first SQLite and AI-assisted expense parsing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # ─── Icons ───────────────────────────────────────────
  cupertino_icons: ^1.0.9

  # ─── Charts ──────────────────────────────────────────
  fl_chart: ^1.2.0

  # ─── Storage ─────────────────────────────────────────
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^11.1.1
  path_provider: ^2.1.4

  # ─── Database ────────────────────────────────────────
  # sqlite3 2.x + sqflite_common_ffi 2.3.x = compatible
  # Ang sqlite3_flutter_libs ay bundled native binary —
  # hindi na mag-download mula GitHub.
  sqflite: ^2.3.3+1
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.24
  sqflite_common_ffi: ^2.3.7+1
  sqflite_common_ffi_web: ^0.4.5+4
  path: ^1.9.0

  # ─── Utility ─────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.20.3
  csv: ^6.0.0
  json_annotation: ^4.12.0

  # ─── Networking ──────────────────────────────────────
  http: ^1.2.2
  connectivity_plus: ^7.3.1

  # ─── State management ────────────────────────────────
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dev_build: ^1.1.12
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

